<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">cmux outside, Herdr inside: target research collaboration architecture</title>
  <desc id="desc">A senior supervisor coordinates four chapter workspaces through cmux. Each workspace hosts one Herdr session containing a supervisor and executors. Skills define shared rules and a research workflow. This is a target architecture, not evidence of a completed live run.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#101c30"/><stop offset="1" stop-color="#192d47"/></linearGradient>
  </defs>
  <rect width="1280" height="720" rx="24" fill="url(#bg)"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="60" y="66" font-size="16" font-weight="700" letter-spacing="3" fill="#6fe5ca">MULTI-AGENT COLLABORATION UPGRADE</text>
    <text x="60" y="126" font-size="43" font-weight="700" fill="#f5f8ff">One research team. Two coordination layers.</text>
    <text x="60" y="164" font-size="21" fill="#bdcbe1">Codex + Claude Code · shared rules · traceable results</text>
    <rect x="938" y="44" width="282" height="32" rx="16" fill="#293e59"/>
    <text x="1079" y="66" text-anchor="middle" font-size="13" font-weight="700" letter-spacing="1" fill="#d7e4f7">TARGET ARCHITECTURE</text>
    <rect x="456" y="214" width="368" height="66" rx="16" fill="#203b4b" stroke="#6fe5ca" stroke-width="2"/>
    <text x="640" y="242" text-anchor="middle" font-size="20" font-weight="700" fill="#f5f8ff">Senior supervisor</text>
    <text x="640" y="265" text-anchor="middle" font-size="15" fill="#a8ddcf">Whole-thesis integration</text>
    <g stroke="#6fe5ca" stroke-width="2" fill="none"><path d="M640 280V316M195 348V316H1085V348M491 316V348M789 316V348"/></g>
    <rect x="60" y="296" width="268" height="30" rx="15" fill="#101c30"/>
    <text x="75" y="317" font-size="15" font-weight="700" fill="#6fe5ca">CMUX / across workspaces</text>
