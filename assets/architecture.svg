    <text x="1220" y="661" text-anchor="end" font-size="16" fill="#6fe5ca">Pure cmux remains supported as a workflow.</text>
    <text x="1220" y="690" text-anchor="end" font-size="14" fill="#bdcbe1">Live nested collaboration acceptance: pending</text>
